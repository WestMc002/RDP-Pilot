# reitzner RDP Pilot - automatische Bereitstellung als Download (Release)
# Ausloeser: Aenderung dieser Datei auf main oder per Hand ueber "Run workflow"
# mit Versionsangabe. Die Version kommt sonst aus dem neuesten Commit
# "reitzner RDP Pilot <Version> - Aenderungen".
# Gibt es das Release zur Version noch nicht, wird gebaut und das Release mit
# dem ZIP angelegt. Gibt es es schon, wird nur der Release-Text aufgefrischt.
# Release-Text: oben "Aenderungen" (Zeilen mit "- " aus dem neuesten Commit,
# der die Versionsnummer nennt), darunter "Installation".

name: Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.12.2026.1101)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ver = '${{ github.event.inputs.version }}'
          if(-not $ver) {
            $subjects = git log --format=%s
            foreach($s in $subjects) {
              if($s -match '^reitzner RDP Pilot v?(\d+\.\d+\.\d+\.\d+)') { $ver = $Matches[1]; break }
            }
          }
          if($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "ungueltige oder fehlende Version: $ver" }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if($LASTEXITCODE -eq 0) { "exists=1" >> $env:GITHUB_OUTPUT; Write-Host "Release v$ver existiert bereits - nur Text auffrischen" }
          else { "exists=0" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Release-Text erstellen
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ver = '${{ steps.ver.outputs.ver }}'
          # Neuester Commit, dessen Text die Versionsnummer nennt
          $hash = git log --format=%H --fixed-strings --grep="$ver" -n 1
          $items = @()
          if($hash) {
            $msg = git log -1 --format=%B $hash
            $items = @($msg | Where-Object { $_ -match '^\s*[-*]\s+\S' } | ForEach-Object { "- " + ($_ -replace '^\s*[-*]\s+','') })
          }
          if($items.Count -eq 0) { throw "Kein Commit mit Versionsnummer $ver und Aenderungspunkten gefunden" }
          $zip = "reitzner-RDP-Pilot-$ver.zip"
          $lines = @()
          $lines += "## Änderungen"
          $lines += ""
          $lines += $items
          $lines += ""
          $lines += "## Installation"
          $lines += ""
          $lines += "1. ``$zip`` herunterladen und in einen eigenen Ordner mit Schreibrechten entpacken, am besten in den Ordner, in dem deine Verbindungen (.rdp-Dateien) liegen. Eine Installation ist nicht nötig."
          $lines += "2. ``reitzner RDP Pilot.exe`` per Doppelklick starten. Das Programm zeigt alle .rdp-Dateien aus seinem Ordner an."
          # Typografische Anführungszeichen nur in '...' - PowerShell wertet sie in "..." als Stringende
          $lines += '3. Verbindung auswählen, die gewünschten Monitore anklicken (Hauptmonitor per Rechtsklick) und „Speichern & verbinden“ wählen.'
          $lines += ""
          $lines += "Bei einem Update die vorhandene EXE einfach ersetzen."
          $lines += ""
          $lines += "Voraussetzungen: Windows 10 oder 11 mit .NET Framework 4.x."
          $lines += ""
          $lines += "Eine ausführliche Beschreibung steht in ``Liesmich.txt`` im ZIP."
          [System.IO.File]::WriteAllText("$PWD\notes.md", ($lines -join "`n") + "`n", (New-Object System.Text.UTF8Encoding($false)))
          Get-Content notes.md -Encoding utf8

      - name: Kompilieren
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          @(
            "[assembly: System.Reflection.AssemblyVersion(`"$ver`")]"
            "[assembly: System.Reflection.AssemblyFileVersion(`"$ver`")]"
            "[assembly: System.Reflection.AssemblyInformationalVersion(`"$ver`")]"
            "namespace RDPilot { public static partial class AppInfo { public const string Version = `"$ver`"; } }"
          ) | Set-Content Quellcode\VersionInfo.cs -Encoding utf8
          New-Item -ItemType Directory -Force Bin | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /codepage:65001 "/out:Bin\reitzner RDP Pilot.exe" `
            "/win32icon:Resources\RDPilot.ico" "/resource:Resources\RDPilot.ico,RDPilot.ico" `
            "/resource:Resources\Logo-hell.png,Logo-hell.png" "/resource:Resources\Logo-dunkel.png,Logo-dunkel.png" `
            "/resource:Resources\AppIcon.png,AppIcon.png" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll Quellcode\*.cs
          if($LASTEXITCODE -ne 0) { throw 'Kompilieren fehlgeschlagen' }
          (Get-Item "Bin\reitzner RDP Pilot.exe").VersionInfo.FileVersion

      - name: Release anlegen
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          $zip = "Bin\reitzner-RDP-Pilot-$ver.zip"
          Copy-Item Liesmich.txt Bin\
          Compress-Archive -Path "Bin\reitzner RDP Pilot.exe","Bin\Liesmich.txt" -DestinationPath $zip -Force
          gh release create "v$ver" $zip --title "reitzner RDP Pilot $ver" --notes-file notes.md --target $env:GITHUB_SHA

      - name: Release-Text auffrischen
        if: steps.ver.outputs.exists == '1'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          gh release edit "v$ver" --notes-file notes.md
