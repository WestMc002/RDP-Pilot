# reitzner RDP Pilot - automatische Bereitstellung der EXE
# Baut das Programm, sobald ein Tag v<Version> gepusht wird (oder per Hand
# ueber "Run workflow" mit Versionsangabe), und legt ein Release mit der EXE an.
# Die Release-Seite zeigt oben "Änderungen" (Punkte aus dem Commit-Text,
# Zeilen mit "- ") und darunter die Installation.
# Existiert das Release zur Version schon, passiert nichts.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. 1.8.2026.1031)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: ver
        shell: pwsh
        run: |
          $ver = '${{ github.event.inputs.version }}'
          if(-not $ver) { $ver = '${{ github.ref_name }}'.TrimStart('v') }
          if($ver -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "ungueltige Version: $ver" }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if($LASTEXITCODE -eq 0) { "exists=1" >> $env:GITHUB_OUTPUT; Write-Host "Release v$ver existiert bereits" }
          else { "exists=0" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Kompilieren
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          @(
            "[assembly: System.Reflection.AssemblyVersion(`"$ver`")]"
            "[assembly: System.Reflection.AssemblyFileVersion(`"$ver`")]"
            "[assembly: System.Reflection.AssemblyInformationalVersion(`"$ver`")]"
            "namespace RDPilot { public static partial class AppInfo { public const string Version = `"$ver`"; } }"
          ) | Set-Content Quellcode\VersionInfo.cs -Encoding utf8
          New-Item -ItemType Directory -Force Bin | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /codepage:65001 "/out:Bin\reitzner RDP Pilot.exe" `
            "/win32icon:Resources\RDPilot.ico" "/resource:Resources\RDPilot.ico,RDPilot.ico" `
            "/resource:Resources\Logo-hell.png,Logo-hell.png" "/resource:Resources\Logo-dunkel.png,Logo-dunkel.png" `
            "/resource:Resources\AppIcon.png,AppIcon.png" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll Quellcode\*.cs
          if($LASTEXITCODE -ne 0) { throw 'Kompilieren fehlgeschlagen' }
          (Get-Item "Bin\reitzner RDP Pilot.exe").VersionInfo.FileVersion

      - name: Release anlegen
        if: steps.ver.outputs.exists == '0'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.ver }}'
          Copy-Item "Bin\reitzner RDP Pilot.exe" "Bin\reitzner-RDP-Pilot.exe"
          # Abschnitt "Änderungen": Punkte aus dem Commit-Text (Zeilen mit "- " oder "* "),
          # sonst die erste Zeile ohne vorangestellten Programmnamen und Version
          $msg = git log -1 --format=%B $env:GITHUB_SHA
          $items = @($msg | Where-Object { $_ -match '^\s*[-*]\s+\S' } | ForEach-Object { '- ' + ($_ -replace '^\s*[-*]\s+','') })
          if($items.Count -eq 0) {
            $subject = ($msg | Select-Object -First 1) -replace '^reitzner RDP Pilot\s+[\d.]+\s*:\s*',''
            $items = @('- ' + $subject)
          }
          $changes = "## `u{00C4}nderungen`n`n" + ($items -join "`n") + "`n`n## Installation`n`n"
          $install = @"
          ``reitzner-RDP-Pilot.exe`` herunterladen und in den Ordner legen, in dem deine Verbindungen (.rdp-Dateien) liegen. Doppelklick startet das Programm, eine Installation ist nicht noetig. Voraussetzung: Windows 10 oder 11 mit .NET Framework 4.x.

          Bei einem Update die vorhandene EXE einfach ersetzen.

          **English:** download ``reitzner-RDP-Pilot.exe`` and put it into the folder that contains your connections (.rdp files). Double-click to start, no installation needed. Requires Windows 10 or 11 with .NET Framework 4.x.
          "@
          $changes + $install | Set-Content notes.md -Encoding utf8
          gh release create "v$ver" "Bin\reitzner-RDP-Pilot.exe" --title "reitzner RDP Pilot $ver" --notes-file notes.md --target $env:GITHUB_SHA
